<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעיינות · שיעורי חסידות</title>
<meta name="description" content="שיעורי חסידות מוקלטים על פרשת השבוע והמועדים – להאזנה בבית ובדרך">
<meta name="theme-color" content="#f5efe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מעיינות">
<link rel="preload" href="suez-one-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Suez One';font-weight:400;font-display:swap;src:url(suez-one-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Suez One';font-weight:400;font-display:swap;src:url(suez-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Assistant';font-weight:400;font-display:swap;src:url(assistant-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:600;font-display:swap;src:url(assistant-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:700;font-display:swap;src:url(assistant-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:800;font-display:swap;src:url(assistant-hebrew-800-normal.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:400;font-display:swap;src:url(assistant-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Assistant';font-weight:700;font-display:swap;src:url(assistant-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{
  --paper:#f5efe4; --paper2:#ebe3d3; --card:#fbf8f2; --ink:#1c2433; --ink2:#3a4356; --muted:#6c6f78;
  --line:#dcd2bf; --navy:#1f3354; --navy2:#16253e; --brass:#9a7a45; --brass-soft:#efe3cc;
  --display:"Suez One","Frank Ruhl Libre",serif; --text:"Assistant","Segoe UI",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --tab:64px;
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
html[data-scale="2"]{font-size:19.5px} html[data-scale="3"]{font-size:22px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);line-height:1.5;padding-bottom:calc(var(--tab) + 90px + var(--safe-b))}
body.has-mini{padding-bottom:calc(var(--tab) + 160px + var(--safe-b))}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:8px}
svg{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* app bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(245,239,228,.94);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.bar.scrolled{border-color:var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:60px;padding-top:var(--safe-t)}
.brand{display:flex;align-items:center;gap:9px;margin-inline-end:auto}
.brand b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--navy);line-height:1}
.topnav{display:none;gap:4px}
.topnav a{padding:8px 14px;border-radius:10px;font-weight:700;color:var(--ink2)}
.topnav a[aria-current="page"]{background:var(--paper2);color:var(--navy)}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--navy)}
.ibtn:hover{background:var(--paper2)}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(251,248,242,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar nav{display:flex;max-width:600px;margin:0 auto;height:var(--tab)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tabbar a[aria-current="page"]{color:var(--navy)}
.tabbar a[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:860px){.tabbar{display:none}.topnav{display:flex}body{padding-bottom:40px}body.has-mini{padding-bottom:120px}}

/* common */
h2.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:400;font-size:1.55rem;color:var(--navy);margin:34px 0 12px;line-height:1.15}
h2.sec a{font-family:var(--text);font-size:.92rem;font-weight:700;color:var(--brass)}
.eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.5px;color:var(--brass);margin:0}
.yr{display:inline-block;padding:0 7px;border-radius:6px;background:var(--brass-soft);color:#6d5426;font-weight:700;font-size:.8rem;line-height:1.65}
.lang{display:inline-block;padding:0 7px;border-radius:6px;background:#e3e8f0;color:var(--navy);font-weight:700;font-size:.8rem;line-height:1.65}
.done{color:#3f7a4f;font-weight:700}
.muted{color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font-weight:700}
.btn.navy{background:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy2)}
.btn.light{background:#fff;color:var(--navy)}
.btn.out{border:1.5px solid var(--line);color:var(--navy);background:var(--card)}
.av{border-radius:50%;object-fit:cover;background:var(--paper2);flex:none}

/* weekly */
.weekly{margin-top:16px;background:var(--navy);color:#fff;border-radius:22px;padding:22px 20px 18px;position:relative;overflow:hidden}
.weekly .eyebrow{color:#e5d2a8}
.weekly h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,11vw,4rem);line-height:1;margin:6px 0 6px}
.weekly .wm{color:#c5ccda;margin:0 0 16px}
.wrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x mandatory}
.wrow::-webkit-scrollbar{display:none}
.wcard{flex:none;width:min(78%,300px);scroll-snap-align:start;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.08);text-align:right}
.wcard:hover{background:rgba(255,255,255,.13)}
.wcard .t{font-weight:700;line-height:1.25}
.wcard .m{font-size:.86rem;color:#c5ccda}
.wcard .pp{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;margin-inline-start:auto}
.weekly .all{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:700;color:#f1e4c8}

/* continue */
.cont{display:flex;align-items:center;gap:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;text-align:right;margin-top:14px}
.cont .k{font-size:.78rem;font-weight:800;color:var(--brass)}
.cont .t{font-weight:700;line-height:1.3}
.cont .m{color:var(--muted);font-size:.88rem}
.cont .pr{height:4px;background:var(--paper2);border-radius:4px;margin-top:6px;overflow:hidden}
.cont .pr i{display:block;height:100%;background:var(--brass)}
.cont .pp{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}

/* rabbis */
.rrow{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.rrow::-webkit-scrollbar{display:none}
.rchip{flex:none;width:104px;text-align:center}
.rchip img{width:96px;height:96px;margin:0 auto 8px;display:block;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.rchip b{display:block;font-weight:700;line-height:1.2;font-size:.98rem}
.rchip span{font-size:.82rem;color:var(--muted)}
.rgrid{display:grid;gap:12px;margin-top:16px}
@media (min-width:700px){.rgrid{grid-template-columns:repeat(3,1fr)}}
.rcard{display:flex;align-items:center;gap:16px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.rcard img{width:84px;height:84px;border-radius:16px}
.rcard b{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--navy);line-height:1.2}
.rcard span{color:var(--muted);font-size:.9rem}

/* parsha index */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:4px 0 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:11px 13px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--navy);border-color:var(--navy)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:860px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pcell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 14px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:right;min-height:78px}
.pcell:hover{border-color:var(--brass)}
.pcell b{font-family:var(--display);font-weight:400;font-size:1.22rem;color:var(--navy);line-height:1.15}
.pcell span{font-size:.84rem;color:var(--muted)}
.pcell.now{background:var(--navy);border-color:var(--navy)}
.pcell.now b{color:#fff}.pcell.now span{color:#c5ccda}

/* search */
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin-top:16px}
.search:focus-within{border-color:var(--navy)}
.search input{flex:1;border:0;outline:0;background:none;font-size:1.05rem;min-width:0}

/* list rows */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.row .pb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;flex:none}
.row .pb:hover{background:var(--navy);color:#fff}
.row.playing .pb{background:var(--navy);color:#fff}
.row .av{width:46px;height:46px}
.row .main{flex:1;min-width:0;text-align:right}
.row .rt{font-weight:700;font-size:1.04rem;line-height:1.3}
.row .rm{display:flex;flex-wrap:wrap;gap:3px 9px;align-items:center;color:var(--muted);font-size:.86rem;margin-top:2px}
.row .dl{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.row .dl:hover{background:var(--paper2);color:var(--navy)}
.row .prog{position:absolute;bottom:-1px;right:0;height:2px;background:var(--brass)}
.group{margin-top:26px}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ghead img{width:38px;height:38px}
.ghead b{font-weight:800;font-size:1.05rem}

/* page heads */
.phead{padding:22px 0 4px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--navy);padding:6px 0}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vw,3rem);color:var(--navy);line-height:1.05;margin:8px 0 6px}
.phead p{color:var(--muted);margin:0 0 14px}
.rhead{display:flex;align-items:center;gap:18px;padding:20px 0 6px}
.rhead img{width:112px;height:112px;border-radius:24px;box-shadow:0 8px 24px rgba(28,36,51,.15)}
.rhead h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--navy);line-height:1.1;margin:0 0 4px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper2);margin:16px 0 4px}
.seg button{padding:9px 16px;border-radius:10px;font-weight:700;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.frow{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);width:100%;text-align:right}
.frow .fn{flex:1;font-family:var(--display);font-size:1.22rem;color:var(--navy);line-height:1.2}
.frow:hover .fn{color:var(--brass)}
.frow .fc{color:var(--muted);font-size:.88rem;white-space:nowrap}
.fidx{display:grid;column-gap:36px}
@media (min-width:760px){.fidx{grid-template-columns:1fr 1fr}}

/* more */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-top:12px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ri{width:42px;height:42px;border-radius:12px;background:var(--paper2);color:var(--navy);display:grid;place-items:center}
.mrow b{display:block;font-weight:700}
.mrow span{color:var(--muted);font-size:.9rem}
.mrow .ph{font-weight:800;color:var(--navy);direction:ltr}
.note{font-size:.84rem;color:var(--muted);margin:8px 2px 0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-size:1rem;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--navy)}
.kind{display:flex;gap:8px;margin:14px 0 12px}
.kind button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;background:#fff;color:var(--ink2)}
.kind button[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:#eef1f6}

/* eq / skeleton */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:15px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.paused .eq i{animation-play-state:paused}
.sk{height:60px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(0,0,0,.05),transparent);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* mini player */
#mini{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--safe-b));z-index:44;padding:0 8px 8px}
#mini[hidden]{display:none}
@media (min-width:860px){#mini{bottom:0;padding-bottom:12px}}
.mini{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:16px;background:var(--navy);color:#fff;box-shadow:0 8px 26px rgba(20,25,40,.28);position:relative;overflow:hidden}
.mini .open{flex:1;min-width:0;text-align:right;display:flex;align-items:center;gap:10px}
.mini img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.mini .mt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mm{color:#c3cad8;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:50px;height:50px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.mini .mp{position:absolute;bottom:0;left:0;height:3px;background:#e5d2a8}

/* player */
#player{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;pointer-events:none}
#player.open{visibility:visible;pointer-events:auto}
#player .dim{position:absolute;inset:0;background:rgba(20,22,30,.45);opacity:0;transition:opacity .25s}
#player.open .dim{opacity:1}
.sheet{position:relative;width:100%;height:100%;background:var(--paper);overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#player.open .sheet{transform:none}
@media (min-width:860px){
  #player{align-items:center}
  .sheet{width:460px;height:auto;max-height:92vh;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:translateY(30px) scale(.98);opacity:0;transition:transform .25s, opacity .25s}
  #player.open .sheet{opacity:1}
}
.sh-top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 14px 0}
.sh-top span{font-weight:800;font-size:.82rem;color:var(--muted);letter-spacing:.4px}
.sh-top button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--navy)}
.sh-top button:hover{background:var(--paper2)}
.sh-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 24px calc(26px + var(--safe-b));max-width:460px;width:100%;margin:0 auto}
.art{width:min(68vw,280px);aspect-ratio:1;border-radius:24px;object-fit:cover;margin:6px auto 4px;box-shadow:0 18px 40px rgba(28,36,51,.22);display:block}
@media (min-width:860px){.art{width:240px}}
.pt{font-family:var(--display);font-weight:400;font-size:1.75rem;line-height:1.15;margin:0;color:var(--navy);text-align:center}
.pm{color:var(--muted);margin:4px 0 0;text-align:center}
.seek{direction:ltr}
.seek input{width:100%;height:32px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
.seek input::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--navy) var(--p,0%),var(--paper2) var(--p,0%))}
.seek input::-moz-range-track{height:6px;border-radius:6px;background:var(--paper2)}
.seek input::-moz-range-progress{height:6px;border-radius:6px;background:var(--navy)}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--navy);margin-top:-7px;border:3px solid var(--paper)}
.seek input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--navy);border:3px solid var(--paper)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.ctrls{direction:ltr;display:flex;align-items:center;justify-content:center;gap:clamp(10px,4.5vw,24px)}
.cb{width:60px;height:60px;border-radius:50%;color:var(--navy);display:grid;place-items:center;position:relative}
.cb:hover{background:var(--paper2)}
.cb small{position:absolute;font-size:.68rem;font-weight:800;top:50%;left:50%;transform:translate(-50%,-36%)}
.cb.sm{width:48px;height:48px}
.bigplay{width:84px;height:84px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(31,51,84,.3)}
.bigplay.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{height:60px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.opt b{font-size:1rem;color:var(--navy);line-height:1.1;font-weight:800}
.opt span{font-size:.74rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:#eef1f6}

#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 92px + var(--safe-b));transform:translateX(-50%) translateY(14px);opacity:0;z-index:80;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;transition:.25s;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar">

 ['devarim','דברים','devarim','דברים','חזון'],['tishabav','תשעה באב','devarim','תשעה באב','תב','ט באב','תשעת הימים'],['vaetchanan','ואתחנן','devarim','ואתחנן'],['tubav','ט״ו באב','devarim','טו באב'],['ekev','עקב','devarim','עקב'],['reeh','ראה','devarim','ראה'],['elul','אלול','devarim','אלול'],['shoftim','שופטים','devarim','שופטים'],['kiteitzei','כי תצא','devarim','כי תצא'],['chaielul','ח״י אלול','devarim','חי אלול'],['kitavo','כי תבוא','devarim','כי תבוא'],['nitzavim','נצבים','devarim','נצבים','נצו','נצוי'],['vayelech','וילך','devarim','וילך','נצוי'],['haazinu','האזינו','devarim','האזינו'],['vezot','וזאת הברכה','devarim','וזאת הברכה'],

const PK = Object.fromEntries(P.map(p=>[p.key,p]));
const nrm = s => ' '+s.replace(/[״"'׳`]/g,'').replace(/[,.\-–()#:;!?\/\\]+/g,' ').replace(/\s+/g,' ').trim()+' ';
function keysOf(text){ const t=nrm(text); return P.filter(p=>p.aliases.some(a=>t.includes(' '+a+' '))).map(p=>p.key); }

/* ---------- storage ---------- */
const store = { get(k,d){ try{ const v=localStorage.getItem('mt_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('mt_'+k,JSON.stringify(v)); }catch(e){} } };
let progress = store.get('progress',{}), favs = new Set(store.get('favs',[])), prefs = Object.assign({rate:1,scale:1,auto:true}, store.get('prefs',{}));

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normQ = s=>s.replace(/''|"/g,'״').replace(/'/g,'׳');
const fmt = sec=>{ if(!isFinite(sec)||sec<0) sec=0; sec=Math.floor(sec); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); };
const mins = sec=>Math.max(1,Math.round(sec/60))+' דק׳';
const LET='אבגדהוזחט';
const YEAR_RE = /(^|[\s(])(?:תש(?:''|"|״)פ|(?:תש)?פ(?:''|"|״)([א-ט]))(?=[\s)\-–,.]|$)/;
const YEAR_RE_G = new RegExp(YEAR_RE.source,'g');
function yearOf(n){ const m=n.match(YEAR_RE); if(!m) return {n:-1,label:''}; if(!m[2]) return {n:0,label:'תש״פ'}; return {n:LET.indexOf(m[2])+1,label:'תשפ״'+m[2]}; }
function namePatterns(full){ const w=full.replace(/^הרב\s+/,'').split(/\s+/); const first=w.slice(0,-1).join(' '), last=w[w.length-1];
  return [`הרב ${first} ${last}`,`${last} הרב ${first}`,`הרב ${first}`,last].filter(Boolean); }
function clean(s, rabbi){
  s = s.replace(/\.(mp3|m4a|aac|ogg|wav)$/i,'');
  namePatterns(rabbi.name).forEach(p=>{ s=s.split(p).join(' '); });
  s = s.replace(/\(?\s*אידיש\s*\)?/g,' ').replace(/(^|\s)עברית(?=\s|$)/g,' ').replace(/כל השנים/g,' ');
  s = s.replace(YEAR_RE_G,'$1 ').replace(/(^|\s)[-–]\s*[א-ט](?=\s|\)|$)/g,' ');
  s = s.replace(/\(\s*\)/g,' ').replace(/^\s*\d+\s+/,'').replace(/^\s*(?:\d+\s*)?פרשת\s+/,'');
  s = s.split(/\s*[-–]\s*/).map(x=>x.replace(/^[\s,]+|[\s,]+$/g,'')).filter(Boolean).join(' – ');
  return normQ(s.replace(/\s+/g,' ').trim());
}
const leadNum = n=>{ const m=n.match(/^\s*(\d+)/); return m?+m[1]:0; };
function audioUrl(s){ return 'https://www.googleapis.com/drive/v3/files/'+s.id+'?alt=media&key='+CONFIG.DRIVE_KEY; }
function downloadUrl(s){ return 'https://drive.google.com/uc?export=download&id='+s.id; }

/* ---------- library ---------- */
let LIB=null, RABBIS=[], RB={}, FOLDERS={}, ALL=[], BY={}, BYKEY={};
function build(lib){
  RABBIS=[];RB={};FOLDERS={};ALL=[];BY={};BYKEY={};
  lib.rabbis.forEach(r=>{
    const R={id:r.id,name:r.name,photo:r.photo,cols:[],count:0,langs:new Set()};
    r.collections.forEach((c,ci)=>{
      const col={label:c.label,lang:c.lang,folders:[]};
      c.folders.forEach(f=>{
        const fy=yearOf(f.name.replace(/"/g,'״').replace(/״/g,"''"));
        const fkeys=keysOf(f.name);
        const isYear = fy.n>=0 && !fkeys.length;
        const F={id:f.id,raw:f.name,name:isYear?fy.label:(clean(f.name,r)||f.name),isYear,yearN:fy.n,keys:fkeys,rabbi:R,lang:c.lang,col:c.label,shiurim:[],
          order: leadNum(f.name)>0&&leadNum(f.name)<100 ? leadNum(f.name) : (fkeys.length?PK[fkeys[0]].i:999)};
        f.files.forEach(x=>{
          const y=yearOf(x.name).n>=0?yearOf(x.name):fy;
          const tk=keysOf(x.name);
          const s={id:x.id,title:clean(x.name,r)||F.name,yearN:y.n,yearLabel:y.label,num:leadNum(x.name),size:x.size,created:x.created||'',
            folder:F,rabbi:R,lang:c.lang,keys:tk.length?tk:fkeys};
          F.shiurim.push(s);ALL.push(s);BY[s.id]=s;
          s.keys.forEach(k=>(BYKEY[k]=BYKEY[k]||[]).push(s));
        });
        F.shiurim.sort((a,b)=>(b.yearN-a.yearN)||(b.num-a.num)||(b.created>a.created?1:-1));
        if(F.shiurim.length){ col.folders.push(F); FOLDERS[F.id]=F; R.count+=F.shiurim.length; R.langs.add(c.lang); }
      });
      col.folders.sort((a,b)=> (a.isYear&&b.isYear)?(b.yearN-a.yearN):(a.order-b.order));
      if(col.folders.length) R.cols.push(col);
    });
    RABBIS.push(R);RB[R.id]=R;
  });
  Object.values(BYKEY).forEach(l=>l.sort((a,b)=>(b.yearN-a.yearN)||(b.created>a.created?1:-1)));
}
async function load(){
  try{ const r=await fetch(CONFIG.LIBRARY_URL,{cache:'no-store'}); if(!r.ok) throw 0; LIB=await r.json(); store.set('lib',LIB); }

}

function row(s, o={}){
  const p=progress[s.id]||{}, cur=current&&current.id===s.id, pct=p.d?Math.min(100,(p.t||0)/p.d*100):0, m=[];
  if(s.yearLabel) m.push(`<span class="yr">${s.yearLabel}</span>`);
  if(o.lang!==false && s.lang==='yi') m.push(langTag('yi'));
  if(o.rabbi) m.push(`<span>${esc(s.rabbi.name)}</span>`);

  if(p.done) m.push('<span class="done">✓ נשמע</span>'); else if(p.d&&p.t>5) m.push(`<span>נותרו ${mins(p.d-p.t)}</span>`); else if(p.d) m.push(`<span>${mins(p.d)}</span>`);
  const lead = o.avatar ? `<img class="av" src="${s.rabbi.photo}" alt="" loading="lazy">` : '';
  return `<div class="row${cur?' playing':''}">${lead}
    <button class="main" data-play="${s.id}"><div class="rt">${esc(s.title)}</div><div class="rm">${m.join('')}</div></button>

  let h='<div class="wrap">';
  if(WEEK && ws.length){

    h+=`<section class="weekly"><p class="eyebrow">פרשת השבוע</p><h1>${esc(normQ(WEEK.name))}</h1>

function parshaIndex(compact){
  const avail=P.filter(p=>BYKEY[p.key]);
  const secs=SECTIONS.filter(([k])=>avail.some(p=>p.sec===k));
  const now=WEEK?PK[WEEK.keys[0]]:null;
  const cur=secTab && secs.some(s=>s[0]===secTab) ? secTab : (now?now.sec:secs[0][0]);
  return `<div class="tabs" role="tablist">${secs.map(([k,l])=>`<button class="tab" role="tab" data-sec="${k}" aria-selected="${k===cur}">${l}</button>`).join('')}</div>
    <div class="pgrid">${avail.filter(p=>p.sec===cur).map(p=>{ const l=BYKEY[p.key], nR=new Set(l.map(s=>s.rabbi.id)).size, isNow=WEEK&&WEEK.keys.includes(p.key);
      return `<a class="pcell${isNow?' now':''}" href="#p-${p.key}"><b>${p.label}</b><span>${isNow?'השבוע · ':''}${cnt(l.length)} · ${nR===1?'רב אחד':nR+' רבנים'}</span></a>`; }).join('')}</div>`;
}

  const groups=RABBIS.map(r=>({r,items:l.filter(s=>s.rabbi===r)})).filter(g=>g.items.length);
  $('#view').innerHTML=`<div class="wrap"><div class="phead">
    <a class="back" href="#parshiot">${I.back}פרשות ומועדים</a>

    <p>${cnt(l.length)} · ${groups.length===1?'רב אחד':groups.length+' רבנים'}</p>

/* ---------- router ---------- */
function go(h){ location.hash = h==='home'?'':h; }
function route(){
  if(!LIB) return;
  const h=location.hash.slice(1); let m;
  if(!h){view='home';renderHome();}
  else if(h==='rabbis'){view='rabbis';renderRabbis();}
  else if(h==='parshiot'){view='parshiot';renderParshiot();}
  else if(h==='more'||h==='contact'){view='more';renderMore(); if(h==='contact') setTimeout(()=>$('#contact').scrollIntoView(),30);}
  else if(m=h.match(/^r-(.+)$/)){view='rabbis';renderRabbi(m[1]);}
  else if(m=h.match(/^f-(.+)$/)){view='rabbis';renderFolder(m[1]);}
  else if(m=h.match(/^p-(.+)$/)){view='parshiot';renderParsha(m[1]);}
  else {view='home';renderHome();}
  setNav(view);
}
window.addEventListener('hashchange',()=>{ route(); window.scrollTo(0,0); });
function refresh(){ const y=scrollY; route(); scrollTo(0,y); }

/* ---------- player ---------- */
const audio=$('#audio');
let current=null, queue=[], sleepIdx=0, sleepTimer=null, sleepEnd=0, lastSave=0;
function play(id,q){
  const s=BY[id]; if(!s) return;
  if(current&&current.id===id){togglePlay();return;}
  saveProgress(true); current=s; queue=q||s.folder.shiurim.map(x=>x.id); store.set('last',id);
  audio.src=audioUrl(s); audio.playbackRate=prefs.rate; audio.play().catch(()=>{});
  setLoading(true); nowPlaying(); $('#mini').hidden=false; document.body.classList.add('has-mini'); refresh();
}
function togglePlay(){ if(!current) return; if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); }
function skip(sec){ if(!current||!isFinite(audio.duration)) return; audio.currentTime=Math.max(0,Math.min(audio.duration-1,audio.currentTime+sec)); }
function step(d){ if(!current) return; const n=queue[queue.indexOf(current.id)+d]; if(n) play(n,queue); else toast(d>0?'זה השיעור האחרון ברשימה':'זה השיעור הראשון ברשימה'); }
function saveProgress(force){ if(!current||!isFinite(audio.duration)||!audio.duration) return; const now=Date.now(); if(!force&&now-lastSave<5000) return; lastSave=now;
  const p=progress[current.id]||{}; p.t=audio.currentTime; p.d=audio.duration; p.ts=now; if(audio.currentTime/audio.duration>.97) p.done=true; progress[current.id]=p; store.set('progress',progress); }
function setLoading(on){ $('#playBtn').classList.toggle('loading',on); buttons(); }
function buttons(){
  const loading=$('#playBtn').classList.contains('loading'), p=audio.paused;
  $('#playBtn').innerHTML = loading&&!p ? '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>' : sz(p?I.play:I.pause,38);
  $('#playBtn').setAttribute('aria-label',p?'ניגון':'השהיה');
  $('#miniPP').innerHTML=sz(p?I.play:I.pause,24); $('#miniPP').setAttribute('aria-label',p?'ניגון':'השהיה');
  document.body.classList.toggle('paused',p);
  document.querySelectorAll('.row.playing .pb').forEach(b=>b.innerHTML=p?I.play:I.eq);
}
function nowPlaying(){
  if(!current) return; const s=current, meta=s.rabbi.name+' · '+s.folder.name+(s.yearLabel&&!s.folder.isYear?' · '+s.yearLabel:'');
  $('#pArt').src=s.rabbi.photo; $('#pArt').alt=s.rabbi.name; $('#miniImg').src=s.rabbi.photo;
  $('#pT').textContent=s.title; $('#pM').textContent=meta+(s.lang==='yi'?' · אידיש':'');
  $('#miniT').textContent=s.title+(s.yearLabel?' '+s.yearLabel:''); $('#miniM').textContent=s.rabbi.name;
  $('#pFav').setAttribute('aria-pressed',favs.has(s.id)); $('#pFav').querySelector('path').setAttribute('fill',favs.has(s.id)?'currentColor':'none');
  $('#dlBtn').href=downloadUrl(s);
  if('mediaSession' in navigator) navigator.mediaSession.metadata=new MediaMetadata({title:s.title+(s.yearLabel?' '+s.yearLabel:''),artist:s.rabbi.name,album:'מעיינות · '+s.folder.name,artwork:[{src:new URL(s.rabbi.photo,location.href).href,sizes:'480x480',type:'image/jpeg'}]});
}
function tick(){ const d=audio.duration,t=audio.currentTime; if(!isFinite(d)||!d) return; const pct=t/d*100, k=$('#seek');
  if(!k.dragging){k.value=Math.round(t/d*1000);k.style.setProperty('--p',pct+'%');}
  $('#tCur').textContent=fmt(t); $('#tLeft').textContent='-'+fmt(d-t); $('#miniP').style.width=pct+'%';
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState){try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate,position:Math.min(t,d)});}catch(e){}} }
audio.addEventListener('loadedmetadata',()=>{ const p=progress[current&&current.id]; if(p&&!p.done&&p.t>10&&p.t<audio.duration-15){audio.currentTime=Math.max(0,p.t-3);toast('ממשיכים מאיפה שעצרת · '+fmt(p.t));} audio.playbackRate=prefs.rate; tick(); });
audio.addEventListener('timeupdate',()=>{tick();saveProgress(false);});
audio.addEventListener('play',buttons); audio.addEventListener('playing',()=>setLoading(false)); audio.addEventListener('waiting',()=>setLoading(true));
audio.addEventListener('pause',()=>{saveProgress(true);buttons();});
audio.addEventListener('ended',()=>{ saveProgress(true); if(current){progress[current.id]=Object.assign(progress[current.id]||{},{done:true});store.set('progress',progress);}
  if(SLEEP[sleepIdx]===-1){setSleep(0);refresh();return;} const n=queue[queue.indexOf(current.id)+1]; if(prefs.auto&&n) play(n,queue); else refresh(); });
audio.addEventListener('error',()=>{ if(!current) return; setLoading(false); toast('לא ניתן לנגן את השיעור כרגע. בדקו את החיבור ונסו שוב.'); });
const seek=$('#seek');
seek.addEventListener('input',()=>{seek.dragging=true;seek.style.setProperty('--p',seek.value/10+'%');$('#tCur').textContent=fmt(seek.value/1000*(audio.duration||0));});
seek.addEventListener('change',()=>{if(isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration;seek.dragging=false;});
function showRate(){$('#rateV').textContent=(prefs.rate===1?'1':prefs.rate)+'×';}
$('#rateBtn').onclick=()=>{prefs.rate=RATES[(RATES.indexOf(prefs.rate)+1)%RATES.length];audio.playbackRate=prefs.rate;store.set('prefs',prefs);showRate();};
function setSleep(i){ sleepIdx=i; clearInterval(sleepTimer); const v=SLEEP[i]; $('#sleepBtn').setAttribute('aria-pressed',v!==0);
  if(v===0){$('#sleepV').textContent='כבוי';return;} if(v===-1){$('#sleepV').textContent='סוף שיעור';return;}
  sleepEnd=Date.now()+v*60000; const t=()=>{const l=sleepEnd-Date.now(); if(l<=0){audio.pause();setSleep(0);toast('הטיימר הסתיים');return;} $('#sleepV').textContent=Math.ceil(l/60000)+' דק׳';}; t(); sleepTimer=setInterval(t,15000); }
$('#sleepBtn').onclick=()=>setSleep((sleepIdx+1)%SLEEP.length);
function showAuto(){$('#autoBtn').setAttribute('aria-pressed',prefs.auto);$('#autoV').textContent=prefs.auto?'פעיל':'כבוי';}
$('#autoBtn').onclick=()=>{prefs.auto=!prefs.auto;store.set('prefs',prefs);showAuto();};
$('#playBtn').onclick=togglePlay; $('#miniPP').onclick=togglePlay; $('#backBtn').onclick=()=>skip(-SKIP); $('#fwdBtn').onclick=()=>skip(SKIP);
$('#prevBtn').onclick=()=>step(-1); $('#nextBtn').onclick=()=>step(1);
$('#pFav').onclick=()=>{ if(!current) return; const id=current.id; if(favs.has(id)){favs.delete(id);toast('הוסר מהשמורים');}else{favs.add(id);toast('נשמר');} store.set('favs',[...favs]); nowPlaying(); };
function openP(){ const p=$('#player'); p.classList.add('open'); p.setAttribute('aria-hidden','false'); setTimeout(()=>$('#playBtn').focus({preventScroll:true}),300); }
function closeP(){ const p=$('#player'); p.classList.remove('open'); p.setAttribute('aria-hidden','true'); $('#miniOpen').focus({preventScroll:true}); }
$('#miniOpen').onclick=openP; $('#pClose').onclick=closeP; $('#pDim').onclick=closeP;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#player').classList.contains('open')) closeP(); if(/INPUT|TEXTAREA/.test(e.target.tagName)) return; if(e.code==='Space'&&current){e.preventDefault();togglePlay();} });
if('mediaSession' in navigator){ const ms=navigator.mediaSession, set=(a,f)=>{try{ms.setActionHandler(a,f);}catch(e){}};
  set('play',()=>audio.play()); set('pause',()=>audio.pause()); set('seekbackward',d=>skip(-(d&&d.seekOffset||SKIP))); set('seekforward',d=>skip(d&&d.seekOffset||SKIP));
  set('previoustrack',()=>step(-1)); set('nexttrack',()=>step(1)); set('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime;}); }

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-play],[data-playall],[data-sec],[data-col],[data-kind]'); if(!t) return;
  if(t.dataset.play){ e.preventDefault(); const s=BY[t.dataset.play]; const h=location.hash; let q=null;
    if(h.startsWith('#p-')) q=(BYKEY[h.slice(3)]||[]).map(x=>x.id); play(t.dataset.play,q); return; }
  if(t.dataset.playall){ const [k,id]=t.dataset.playall.split(':'); const l=k==='f'?FOLDERS[id].shiurim:BYKEY[id]; if(l&&l[0]) play(l[0].id,l.map(x=>x.id)); return; }
  if(t.dataset.sec){ secTab=t.dataset.sec; store.set('sec',secTab); if(view==='parshiot'&&!location.hash.startsWith('#p-')) fillRes(); else refresh(); return; }
  if(t.dataset.col){ const [r,i]=t.dataset.col.split(':'); colTab[r]=+i; refresh(); return; }
  if(t.dataset.kind){ document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b===t)); }
});
document.addEventListener('submit',e=>{ if(e.target.id!=='cform') return; e.preventDefault(); const f=e.target;
  if(!f.name.value.trim()||!f.contact.value.trim()){toast('נא למלא שם ופרטי קשר');return;}
  f.innerHTML='<p style="font-weight:700;color:var(--navy);margin:14px 0 4px">תודה! (בשלב זה הטופס עדיין לא שולח מייל)</p>'; });

/* ---------- misc ---------- */
function applyScale(){ document.documentElement.dataset.scale=prefs.scale; }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveProgress(true); });
window.addEventListener('pagehide',()=>saveProgress(true));
window.addEventListener('scroll',()=>$('#bar').classList.toggle('scrolled',scrollY>8),{passive:true});
let deferredPrompt=null; window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
if('serviceWorker' in navigator && location.protocol==='https:') addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
WEEK=store.get('week',null);
applyScale(); showRate(); showAuto(); buttons(); load();
</script>
</body>
