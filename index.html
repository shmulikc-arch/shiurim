<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<title>מעיינות · שיעורי חסידות של הרב יואב אקריש</title>
<meta name="description" content="שיעורי חסידות של הרב יואב אקריש – לפי פרשות השבוע והמועדים, להאזנה בבית ובדרך">
<meta name="theme-color" content="#f5efe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מעיינות">
<link rel="preload" href="suez-one-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Suez One';font-weight:400;font-display:swap;src:url(suez-one-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}
@font-face{font-family:'Suez One';font-weight:400;font-display:swap;src:url(suez-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Assistant';font-weight:400;font-display:swap;src:url(assistant-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:600;font-display:swap;src:url(assistant-hebrew-600-normal.woff2) format('woff2');unicode-range:U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:700;font-display:swap;src:url(assistant-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:800;font-display:swap;src:url(assistant-hebrew-800-normal.woff2) format('woff2');unicode-range:U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}
@font-face{font-family:'Assistant';font-weight:400;font-display:swap;src:url(assistant-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Assistant';font-weight:700;font-display:swap;src:url(assistant-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

/* גופן הכותרות: כשיגיע הגופן המורשה – מחליפים רק את --display */
:root{
  --paper:#f5efe4; --paper2:#ece4d5; --card:#fbf8f2; --ink:#1c2433; --ink2:#3a4356; --muted:#6c6f78;
  --line:#dcd2bf; --navy:#1f3354; --navy2:#16253e; --brass:#9a7a45; --brass-soft:#efe3cc;
  --display:"Suez One", "Frank Ruhl Libre", serif;
  --text:"Assistant", "Segoe UI", Arial, sans-serif;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html[data-scale="2"]{font-size:19.5px} html[data-scale="3"]{font-size:22px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);line-height:1.55;padding-bottom:calc(96px + var(--safe-b))}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
svg{display:block;flex:none}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(245,239,228,.92);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-color:var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;padding-top:var(--safe-t)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:400;font-size:1.55rem;color:var(--navy);letter-spacing:.3px;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.2px;margin-top:3px}
.nav{display:none;gap:26px;font-weight:600;color:var(--ink2)}
.nav a{text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.nav a:hover{border-color:var(--brass)}
.bar .tools{display:flex;gap:6px}
.ibtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--navy)}
.ibtn:hover{background:var(--paper2)}
@media (min-width:860px){.nav{display:flex}}

/* ---------- hero ---------- */
.hero{position:relative;margin:4px 0 0}
.hero .ph{position:relative;height:min(78vh,620px);min-height:440px;overflow:hidden;background:#2a2219}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
.hero .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,0) 30%,rgba(18,14,10,.55) 62%,rgba(18,14,10,.9) 100%)}
.hero .copy{position:absolute;inset:auto 0 0 0;z-index:2;color:#fff;padding:0 0 34px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;letter-spacing:.4px;color:#f1e4c8}
.kicker:before{content:"";width:22px;height:1.5px;background:currentColor}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,7.4vw,4.2rem);line-height:1.08;margin:10px 0 10px;max-width:14ch}
.hero p{margin:0 0 22px;font-size:1.08rem;color:#eee6d8;max-width:36ch}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 24px;border-radius:999px;font-weight:700;font-size:1.05rem;text-decoration:none;transition:transform .12s, background .15s}
.btn:active{transform:scale(.98)}
.btn.light{background:#fff;color:var(--navy)}
.btn.light:hover{background:var(--brass-soft)}
.btn.ghost{border:1.5px solid rgba(255,255,255,.7);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.navy{background:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy2)}
.btn.line{border:1.5px solid var(--navy);color:var(--navy)}
.btn .pi{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin-inline-start:-10px}
@media (min-width:860px){
  .hero{margin:18px auto 0;max-width:1080px;padding:0 20px}
  .hero .ph{border-radius:22px;height:540px;background:#221b14}
  .hero img{position:absolute;left:0;top:0;width:66%;height:100%;object-position:50% 25%}
  .hero .ph:after{background:linear-gradient(to left,#221b14 0%,#221b14 34%,rgba(34,27,20,.75) 46%,rgba(34,27,20,0) 66%)}
  .hero .copy{top:0;bottom:0;display:flex;align-items:center;padding:0 52px}
  .hero .copy .wrap{padding:0;margin:0;max-width:440px}
}

/* ---------- sections ---------- */
section{padding:44px 0 8px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.sh h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.6vw,2.3rem);line-height:1.1;margin:0;color:var(--navy)}
.sh .sub{color:var(--muted);margin:6px 0 0}
.eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.6px;color:var(--brass);margin:0 0 6px}
.more{font-weight:700;color:var(--navy);text-decoration:none;white-space:nowrap;border-bottom:1.5px solid var(--brass);padding-bottom:2px}
.notice{margin:20px 0 0;padding:12px 16px;border-radius:12px;background:var(--brass-soft);color:#5d4a2a;font-size:.95rem}

/* weekly feature */
.weekly{display:grid;gap:0;background:var(--navy);color:#fff;border-radius:20px;overflow:hidden}
.weekly .wl{padding:26px 24px 24px}
.weekly .tag{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.5px;color:#e9d7b0}
.weekly h3{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:8px 0 6px}
.weekly .wm{color:#c9cfdb;margin:0 0 20px}
.weekly .others{border-top:1px solid rgba(255,255,255,.14)}
.weekly .others button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 24px;text-align:right;border-bottom:1px solid rgba(255,255,255,.1)}
.weekly .others button:hover{background:rgba(255,255,255,.05)}
.weekly .others .yr{background:rgba(255,255,255,.12);color:#f1e4c8}
.weekly .others .t{flex:1;font-weight:600}
@media (min-width:860px){.weekly{grid-template-columns:1.1fr 1fr}.weekly .others{border-top:0;border-right:1px solid rgba(255,255,255,.14)}.weekly .wl{padding:36px}}

/* continue */
.cont{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;text-align:right;margin-top:26px}
.cont .pb{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.cont .k{font-size:.8rem;font-weight:800;color:var(--brass);letter-spacing:.4px}
.cont .t{font-weight:700;font-size:1.1rem;line-height:1.3}
.cont .m{color:var(--muted);font-size:.92rem}
.cont .pr{height:4px;background:var(--paper2);border-radius:4px;margin-top:8px;overflow:hidden}
.cont .pr i{display:block;height:100%;background:var(--brass)}

/* tabs + parsha index */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:1.02rem}
.tab[aria-selected="true"]{color:var(--navy);border-color:var(--navy)}
.idx{display:grid;grid-template-columns:1fr;column-gap:40px}
@media (min-width:700px){.idx{grid-template-columns:1fr 1fr}}
.pi-row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);text-align:right;width:100%}
.pi-row:hover .pn{color:var(--brass)}
.pi-row .pn{flex:1;font-family:var(--display);font-size:1.32rem;color:var(--navy);line-height:1.2;transition:color .15s}
.pi-row .pc{color:var(--muted);font-size:.92rem;white-space:nowrap}
.pi-row .chev{color:var(--brass)}

/* search */
.search{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 14px}
.search:focus-within{border-color:var(--navy)}
.search input{flex:1;border:0;outline:0;background:none;font-size:1.05rem;min-width:0}
.search input::placeholder{color:#9a9488}

/* shiur list */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);position:relative}
.row .pb{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;transition:background .15s,color .15s}
.row .pb:hover{background:var(--navy);color:#fff}
.row.playing .pb{background:var(--navy);color:#fff}
.row .main{flex:1;min-width:0;text-align:right}
.row .rt{font-weight:700;font-size:1.08rem;line-height:1.3}
.row .rm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:2px}
.row .dl{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);text-decoration:none}
.row .dl:hover{background:var(--paper2);color:var(--navy)}
.row .prog{position:absolute;bottom:-1px;right:0;height:2px;background:var(--brass)}
.yr{display:inline-block;padding:0 8px;border-radius:6px;background:var(--brass-soft);color:#6d5426;font-weight:700;font-size:.82rem;line-height:1.6}
.done{color:#3f7a4f;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin-top:10px}

/* folder page */
.fhead{padding:26px 0 6px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--navy);padding:8px 0}
.fhead h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,8vw,3.4rem);color:var(--navy);line-height:1.05;margin:10px 0 6px}
.fhead p{color:var(--muted);margin:0 0 18px}

/* resources */
.res{display:grid;gap:12px}
@media (min-width:700px){.res{grid-template-columns:1fr 1fr}}
.rcard{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none}
.rcard .ri{width:46px;height:46px;border-radius:12px;background:var(--paper2);color:var(--navy);display:grid;place-items:center}
.rcard b{display:block;font-weight:700}
.rcard span{color:var(--muted);font-size:.92rem;direction:ltr;unicode-bidi:plaintext}
.ph-note{font-size:.85rem;color:var(--muted);margin-top:8px}

/* contact */
.contact{display:grid;gap:24px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
@media (min-width:860px){.contact{grid-template-columns:1fr 1.2fr;padding:40px}}
.contact h2{font-family:var(--display);font-weight:400;font-size:2rem;color:var(--navy);margin:0 0 8px;line-height:1.1}
.contact p{color:var(--ink2);margin:0 0 16px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-size:1rem;outline:0}
.field input:focus,.field textarea:focus{border-color:var(--navy)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;color:var(--ink2);background:#fff}
.seg button[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:#eef1f6}

footer{margin-top:56px;border-top:1px solid var(--line);padding:26px 0 10px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between}

/* eq */
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:currentColor;border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.paused .eq i{animation-play-state:paused}
.sk{height:64px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(0,0,0,.04),transparent);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- mini player ---------- */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 10px calc(10px + var(--safe-b))}
#mini[hidden]{display:none}
.mini{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:18px;background:var(--navy);color:#fff;box-shadow:0 10px 30px rgba(20,25,40,.28);position:relative;overflow:hidden}
.mini .open{flex:1;min-width:0;text-align:right;display:flex;align-items:center;gap:12px}
.mini .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;object-position:50% 20%}
.mini .mt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mm{color:#c3cad8;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:54px;height:54px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.mini .mp{position:absolute;bottom:0;left:0;height:3px;background:#e9d7b0}

/* ---------- full player ---------- */
#player{position:fixed;inset:0;z-index:60;padding:0;background:var(--paper);display:flex;flex-direction:column;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#player.open{transform:none;visibility:visible}
.pcover{position:relative;height:min(42vh,360px);flex:none;background:#2a2219}
.pcover img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.pcover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,.25),rgba(245,239,228,0) 40%,var(--paper) 100%)}
.ptop{position:absolute;top:calc(10px + var(--safe-t));left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.ptop button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.88);color:var(--navy);display:grid;place-items:center}
.pbody{max-width:560px;width:100%;margin:-30px auto 0;padding:0 22px calc(24px + var(--safe-b));position:relative;z-index:2;display:flex;flex-direction:column;gap:18px}
.pk{font-weight:800;color:var(--brass);font-size:.85rem;letter-spacing:.4px}
.pt{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1;margin:2px 0 4px;color:var(--navy)}
.pm{color:var(--muted);margin:0}
.seek{direction:ltr}
.seek input{width:100%;height:34px;-webkit-appearance:none;appearance:none;background:transparent;margin:0}
.seek input::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--navy) var(--p,0%),var(--paper2) var(--p,0%))}
.seek input::-moz-range-track{height:6px;border-radius:6px;background:var(--paper2)}
.seek input::-moz-range-progress{height:6px;border-radius:6px;background:var(--navy)}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--navy);margin-top:-8px;border:3px solid var(--paper)}
.seek input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--navy);border:3px solid var(--paper)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.92rem}
.ctrls{direction:ltr;display:flex;align-items:center;justify-content:center;gap:clamp(12px,5vw,28px)}
.cb{width:64px;height:64px;border-radius:50%;color:var(--navy);display:grid;place-items:center;position:relative;border:1.5px solid var(--line)}
.cb small{position:absolute;font-size:.7rem;font-weight:800;top:50%;left:50%;transform:translate(-50%,-36%)}
.cb.sm{width:50px;height:50px;border:0}
.bigplay{width:92px;height:92px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(31,51,84,.3)}
.bigplay.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{height:64px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink)}
.opt b{font-size:1.02rem;color:var(--navy);line-height:1.1}
.opt span{font-size:.75rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:#eef1f6}

#toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%) translateY(16px);opacity:0;z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:.25s;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="wrap">
    <a class="brand" href="#" data-top>

<script>
const CONFIG = {
  CATALOG_URL: '',
  DRIVE_KEY: 'AIzaSyBnD0itBvTaxXyC6zS_X3c3ue7wLy86exM',
  PARSHA_API: 'https://www.hebcal.com/shabbat?cfg=json&geonameid=281184&M=on&lg=he',
  RABBI: 'הרב יואב אקריש',
  // קווי טלפון וקישורים – ימולאו מהרשימה שתתקבל
  LINES: [
    {name:'שם הקו', desc:'שיעורי תניא יומיים', phone:'03-0000000'},
    {name:'שם הקו', desc:'מאמרי חסידות', phone:'02-0000000'}
  ],
  SITES: [
    {name:'שם האתר', desc:'ספריית חסידות', url:'https://example.com'},
    {name:'שם האתר', desc:'שיעורים ומאמרים', url:'https://example.com'}
  ]
};
const SECTIONS = [['tishrei','מועדי תשרי'],['bereshit','בראשית'],['shemot','שמות'],['vayikra','ויקרא'],['bamidbar','במדבר'],['devarim','דברים']];
const RATES = [1,1.25,1.5,1.75,2,0.75];
const SLEEP = [0,15,30,45,60,-1];
const SKIP = 15;

const store = {
  get(k,d){ try{ const v=localStorage.getItem('mt_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('mt_'+k, JSON.stringify(v)); }catch(e){} }
};
let progress = store.get('progress',{});
let favs = new Set(store.get('favs',[]));
let prefs = Object.assign({rate:1,scale:1,auto:true}, store.get('prefs',{}));

const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normQ = s=>s.replace(/''|"/g,'״').replace(/'/g,'׳');
const fold = s=>s.replace(/[״"'׳\-–,()]/g,'').replace(/\s+/g,' ').trim();
const fmt = sec=>{ if(!isFinite(sec)||sec<0) sec=0; sec=Math.floor(sec); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); };
const mins = sec=>Math.max(1,Math.round(sec/60))+' דק׳';
const LETTERS='אבגדהוזחט';

function yearOf(n){ if(/תש(''|"|״)פ/.test(n)) return {n:0,label:'תש״פ'}; const m=n.match(/(?:^|\s|\()פ(?:''|"|״)([א-ט])/); return m?{n:LETTERS.indexOf(m[1])+1,label:'תשפ״'+m[1]}:{n:-1,label:''}; }
function cleanTitle(n){ let s=n.replace(/\.mp3$/i,'').trim(); s=s.split(/\s+-\s+/).filter(p=>!/הרב/.test(p)).join(' – '); s=s.replace(/^\d+\s+/,''); s=s.replace(/\s*תש(''|"|״)פ\s*/g,' ').replace(/(^|\s)פ(''|"|״)[א-ט](?=\s|$|\))/g,' '); s=s.replace(/\(\s*\)/g,'').replace(/\s+/g,' ').replace(/[\s–-]+$/,'').replace(/^[\s–-]+/,'').trim(); return normQ(s); }
function cleanFolder(n){ let s=n.split(/\s+-\s+/).filter(p=>!/הרב/.test(p)).join(' – '); s=s.replace(/^\d+\s+/,'').replace(/,?\s*כל השנים/,'').replace(/[\s,]+$/,'').trim(); return normQ(s); }
function sectionOf(o){ if(o<=2.5)return'tishrei'; if(o<=13)return'bereshit'; if(o<=23)return'shemot'; if(o<=31)return'vayikra'; if(o<=41)return'bamidbar'; return'devarim'; }
function audioUrls(s){ if(s.url) return [s.url]; return ['https://www.googleapis.com/drive/v3/files/'+s.id+'?alt=media&key='+CONFIG.DRIVE_KEY]; }
function downloadUrl(s){ return s.url || ('https://drive.google.com/uc?export=download&id='+s.id); }

let CAT=null, FOLDERS=[], ALL=[], BY={};
function parseCatalog(raw){
  FOLDERS=[];ALL=[];BY={};
  (raw.sources||[]).forEach(src=>(src.folders||[]).forEach(f=>{
    let num=parseInt(f.name,10); if(isNaN(num))num=999; if(num>100&&num!==999)num=2.5;
    const folder={id:f.id,name:cleanFolder(f.name),order:num,section:sectionOf(num),rabbi:src.rabbi,shiurim:[]};
    (f.files||[]).forEach(file=>{ const y=yearOf(file.name);
      const s={id:file.id,url:file.url,title:cleanTitle(file.name)||folder.name,year:y.n,yearLabel:y.label,size:file.size,created:file.created||'',folderId:f.id,folderName:folder.name,rabbi:src.rabbi};
      folder.shiurim.push(s);ALL.push(s);BY[s.id]=s; });
    folder.shiurim.sort((a,b)=>(b.year-a.year)||(b.created>a.created?1:-1));
    if(folder.shiurim.length)FOLDERS.push(folder);
  }));
  FOLDERS.sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name,'he'));
}
async function loadCatalog(){
  try{
    if (window.INLINE_CATALOG) CAT = window.INLINE_CATALOG;
    else { const r=await fetch(CONFIG.CATALOG_URL||'catalog.json',{cache:'no-store'}); if(!r.ok)throw 0; CAT=await r.json(); store.set('catalog',CAT); }
  }catch(e){ CAT=store.get('catalog',null); if(!CAT){ $('#view').innerHTML='<div class="wrap"><div class="empty" style="margin-top:30px">לא הצלחנו לטעון את רשימת השיעורים. בדקו את החיבור ונסו שוב.</div></div>'; return; } }
  parseCatalog(CAT); route(); loadParsha();
}

/* weekly parsha */
let PARSHA=null;
async function loadParsha(){
  try{
    const j=await (await fetch(CONFIG.PARSHA_API)).json();
    const it=(j.items||[]).find(i=>i.category==='parashat'); if(!it)return;
    const name=(it.hebrew||'').replace(/^פרשת\s*/,'').trim();
    const words=name.split(/[-\s]+/).filter(Boolean);
    PARSHA={name, folder:FOLDERS.find(f=>words.some(w=>fold(f.name).split(' ').includes(fold(w))))};
    if(!location.hash||location.hash==='#weekly') renderWeekly();
  }catch(e){}
}
function weeklyFolder(){
  if (PARSHA && PARSHA.folder) return {folder:PARSHA.folder, label:'פרשת '+PARSHA.name};
  // אין התאמה (בגרסת ההדגמה) – מציגים את התיקייה עם השיעור החדש ביותר
  const newest=[...ALL].sort((a,b)=>b.created>a.created?1:-1)[0];
  const f=newest&&FOLDERS.find(x=>x.id===newest.folderId);
  return f?{folder:f,label:PARSHA?'פרשת '+PARSHA.name:'השיעור האחרון'}:null;
}
function renderWeekly(){
  const slot=$('#weeklySlot'); if(!slot)return;
  const w=weeklyFolder(); if(!w){slot.innerHTML='';return;}
  const f=w.folder, top=f.shiurim[0], rest=f.shiurim.slice(1,4);
  slot.innerHTML=`<div class="weekly">
    <div class="wl">
      <span class="tag">${esc(w.label)}</span>
      <h3>${esc(f.name)}</h3>
      <p class="wm">${f.shiurim.length} שיעורים מכל השנים · החדש: ${esc(top.title)} ${top.yearLabel}</p>
      <div class="ctas">
        <button class="btn light" data-play="${top.id}"><span class="pi">${PLAY_I.replace(/22/g,'16')}</span>האזנה לשיעור</button>
        <button class="btn ghost" data-folder="${f.id}">כל השיעורים לפרשה</button>
      </div>
    </div>
    <div class="others">${rest.map(s=>`<button data-play="${s.id}"><span class="yr">${s.yearLabel||'—'}</span><span class="t">${esc(s.title)}</span>${PLAY_I.replace(/22/g,'18')}</button>`).join('')}</div>
  </div>`;
  if (PARSHA && !PARSHA.folder && CAT && CAT.sample) slot.insertAdjacentHTML('beforeend','<p class="ph-note">בגרסת ההדגמה אין עדיין שיעורים לפרשה הנוכחית – מוצג השיעור האחרון שעלה.</p>');
}

/* views */
const PLAY_I='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE_I='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const DL_I='<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
const CHEV='<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>';
let tab=store.get('tab','all');

function rowHTML(s,showFolder){
  const p=progress[s.id]||{}, isCur=current&&current.id===s.id, pct=p.d?Math.min(100,(p.t||0)/p.d*100):0, meta=[];
  if(s.yearLabel)meta.push(`<span class="yr">${s.yearLabel}</span>`);
  if(showFolder)meta.push(`<span>${esc(s.folderName)}</span>`);
  if(p.done)meta.push('<span class="done">✓ נשמע</span>');
  else if(p.d&&p.t>5)meta.push(`<span>נותרו ${mins(p.d-p.t)}</span>`);
  else if(p.d)meta.push(`<span>${mins(p.d)}</span>`);
  const icon=isCur&&!audio.paused?'<span class="eq"><i></i><i></i><i></i></span>':PLAY_I;
  return `<div class="row${isCur?' playing':''}">
    <button class="pb" data-play="${s.id}" aria-label="ניגון ${esc(s.title)} ${s.yearLabel}">${icon}</button>
    <button class="main" data-play="${s.id}"><div class="rt">${esc(s.title)}</div><div class="rm">${meta.join('')}</div></button>
    <a class="dl" href="${downloadUrl(s)}" target="_blank" rel="noopener" aria-label="הורדת השיעור">${DL_I}</a>
    ${pct&&!p.done?`<i class="prog" style="width:${pct}%"></i>`:''}</div>`;
}

function renderHome(){
  const lastId=store.get('last',null), last=lastId&&BY[lastId], lp=last&&progress[last.id]||{};
  const tabs=[['all','הכל'],...SECTIONS.filter(([k])=>FOLDERS.some(f=>f.section===k)),['favs','שמורים']];
  const fs=FOLDERS.filter(f=>tab==='all'||f.section===tab);
  let idx;
  if(tab==='favs'){ const l=ALL.filter(s=>favs.has(s.id)); idx=l.length?'<div class="list">'+l.map(s=>rowHTML(s,true)).join('')+'</div>':'<div class="empty">עוד לא שמרתם שיעורים. בנגן לוחצים על סמל הסימנייה כדי לשמור.</div>'; }
  else idx='<div class="idx">'+fs.map(f=>`<button class="pi-row" data-folder="${f.id}"><span class="pn">${esc(f.name)}</span><span class="pc">${f.shiurim.length} שיעורים</span>${CHEV}</button>`).join('')+'</div>';

  $('#view').innerHTML=`
  <div class="hero"><div class="ph">
    <img src="rabbi.jpg" alt="הרב יואב אקריש" fetchpriority="high">
    <div class="copy"><div class="wrap">
      <span class="kicker">שיעורי חסידות על פרשת השבוע והמועדים</span>
      <h1>${esc(CONFIG.RABBI)}</h1>
      <p>מאות שיעורים מכל השנים – לשמוע בבית, בדרך ובכל רגע פנוי.</p>
      <div class="ctas">
        <a class="btn light" href="#weekly"><span class="pi">${PLAY_I.replace(/22/g,'16')}</span>השיעור השבועי</a>
        <a class="btn ghost" href="#archive">לארכיון השיעורים</a>
      </div>
    </div></div>
  </div></div>

  <div class="wrap">
    ${CAT.sample?`<p class="notice">גרסת הדגמה – מוצגות ${FOLDERS.length} פרשות לדוגמה. בגרסה המלאה יופיעו כל השיעורים.</p>`:''}
    ${last&&!lp.done?`<button class="cont" data-play="${last.id}"><span class="pb">${PLAY_I}</span><span style="flex:1;min-width:0"><div class="k">המשך האזנה</div><div class="t">${esc(last.title)} ${last.yearLabel}</div><div class="m">${esc(last.folderName)}${lp.d?' · נותרו '+mins(lp.d-(lp.t||0)):''}</div><div class="pr"><i style="width:${lp.d?(lp.t||0)/lp.d*100:0}%"></i></div></span></button>`:''}

    <section id="weekly">
      <div class="sh"><div><p class="eyebrow">השבוע</p><h2>השיעור השבועי</h2></div></div>
      <div id="weeklySlot"></div>
    </section>

    <section id="archive">
      <div class="sh"><div><p class="eyebrow">${ALL.length} שיעורים</p><h2>ארכיון השיעורים</h2><p class="sub">לפי פרשות השבוע והמועדים, מכל השנים</p></div></div>
      <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6c6f78" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="sr">חיפוש</span><input id="q" type="search" placeholder="חיפוש פרשה, חג או שנה…" autocomplete="off" enterkeyhint="search"></label>
      <div id="results">
        <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>
        ${idx}
      </div>
    </section>

    <section id="lines">
      <div class="sh"><div><p class="eyebrow">להאזנה בטלפון</p><h2>קווי חסידות</h2><p class="sub">קווים טלפוניים עם שיעורי חסידות – גם בלי אינטרנט</p></div></div>
      <div class="res">${CONFIG.LINES.map(l=>`<a class="rcard" href="tel:${l.phone.replace(/\D/g,'')}"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span><span style="flex:1"><b>${esc(l.name)}</b><span>${esc(l.desc)}</span></span><span style="font-weight:700;color:var(--navy)">${esc(l.phone)}</span></a>`).join('')}</div>
      <p class="ph-note">* פרטים לדוגמה – יוחלפו ברשימת הקווים האמיתית.</p>
    </section>

    <section id="sites">
      <div class="sh"><div><p class="eyebrow">עוד ללמוד</p><h2>אתרים מומלצים</h2></div></div>
      <div class="res">${CONFIG.SITES.map(s=>`<a class="rcard" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span><span style="flex:1"><b>${esc(s.name)}</b><span>${esc(s.desc)}</span></span>${CHEV}</a>`).join('')}</div>
      <p class="ph-note">* פרטים לדוגמה.</p>
    </section>

    <section id="contact">
      <div class="contact">
        <div>
          <p class="eyebrow">נשמח לשמוע</p>
          <h2>צור קשר ותרומה לאחזקת האתר</h2>
          <p>בקשות, הערות ושאלות – וגם מי שרוצה לקחת חלק באחזקת האתר והפצת השיעורים.</p>
        </div>
        <form id="cform" novalidate>
          <div class="seg" role="group" aria-label="סוג הפנייה"><button type="button" data-kind="contact" aria-pressed="true">פנייה</button><button type="button" data-kind="donate" aria-pressed="false">תרומה</button></div>
          <label class="field"><span>שם</span><input name="name" autocomplete="name" required></label>
          <label class="field"><span>טלפון או מייל</span><input name="contact" autocomplete="email" required></label>
          <label class="field"><span>הודעה</span><textarea name="msg" rows="3"></textarea></label>
          <button class="btn navy" type="submit" style="width:100%">שליחה</button>
        </form>
      </div>
    </section>
  </div>`;
  renderWeekly();
  bindSearch();
}

function renderResults(){
  const q=$('#q').value.trim(), box=$('#results');
  if(!q){ const y=window.scrollY; renderHome(); $('#q').focus(); window.scrollTo(0,y); return; }
  const fq=fold(normQ(q));
  const res=ALL.filter(s=>fold(s.title+' '+s.folderName+' '+s.yearLabel).includes(fq));
  box.innerHTML=res.length?'<div class="list">'+res.map(s=>rowHTML(s,true)).join('')+'</div>':'<div class="empty">לא נמצאו שיעורים. נסו שם של פרשה או חג.</div>';
}
function bindSearch(){ let t; const q=$('#q'); if(!q)return; q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(renderResults,150);}); }

function renderFolder(id){
  const f=FOLDERS.find(x=>x.id===id); if(!f){location.hash='';return;}
  const ys=f.shiurim.map(s=>s.yearLabel).filter(Boolean);
  $('#view').innerHTML=`<div class="wrap"><div class="fhead">
    <button class="back" data-home><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>לארכיון</button>
    <p class="eyebrow" style="margin-top:14px">${esc((SECTIONS.find(s=>s[0]===f.section)||['',''])[1])}</p>
    <h1>${esc(f.name)}</h1>
    <p>${f.shiurim.length} שיעורים${ys.length?` · ${ys[ys.length-1]} – ${ys[0]}`:''} · ${esc(f.rabbi)}</p>
    <button class="btn navy" data-playall="${f.id}">${PLAY_I.replace(/22/g,'18')} ניגון מהשיעור החדש</button>
  </div>
  <div class="list" style="margin-top:22px">${f.shiurim.map(s=>rowHTML(s,false)).join('')}</div></div>`;
  window.scrollTo({top:0});
}
function route(){
  if(!CAT)return;
  const m=location.hash.match(/^#f-(.+)$/);
  if(m) return renderFolder(m[1]);
  if(!$('#archive')) { renderHome(); }
  const id=location.hash.slice(1);
  if(id){ const el=document.getElementById(id); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),20); }
}
function refresh(){ const y=window.scrollY; const m=location.hash.match(/^#f-(.+)$/); if(m)renderFolder(m[1]); else { const q=$('#q')&&$('#q').value; renderHome(); if(q){$('#q').value=q;renderResults();} } window.scrollTo(0,y); }

/* player */
const audio=$('#audio');
let current=null,queue=[],sleepIdx=0,sleepTimer=null,sleepEnd=0,lastSave=0;
function contextQueue(id){ const s=BY[id],f=FOLDERS.find(x=>x.id===s.folderId); return f?f.shiurim.map(x=>x.id):[id]; }
function play(id,q){
  const s=BY[id]; if(!s)return;
  if(current&&current.id===id){togglePlay();return;}
  saveProgress(true); current=s; queue=q||contextQueue(id); store.set('last',id);
  audio.src=audioUrls(s)[0]; audio.playbackRate=prefs.rate; audio.play().catch(()=>{});
  setLoading(true); updateNowPlaying(); $('#mini').hidden=false; refresh();
}
function togglePlay(){ if(!current)return; if(audio.paused)audio.play().catch(()=>{}); else audio.pause(); }
function skip(sec){ if(!current||!isFinite(audio.duration))return; audio.currentTime=Math.max(0,Math.min(audio.duration-1,audio.currentTime+sec)); }
function step(dir){ if(!current)return; const n=queue[queue.indexOf(current.id)+dir]; if(n)play(n,queue); else toast(dir>0?'זה השיעור האחרון ברשימה':'זה השיעור הראשון ברשימה'); }
function saveProgress(force){
  if(!current||!isFinite(audio.duration)||!audio.duration)return;
  const now=Date.now(); if(!force&&now-lastSave<5000)return; lastSave=now;
  const p=progress[current.id]||{}; p.t=audio.currentTime;p.d=audio.duration;p.ts=now;
  if(audio.currentTime/audio.duration>.97)p.done=true; progress[current.id]=p; store.set('progress',progress);
}
function setLoading(on){ $('#playBtn').classList.toggle('loading',on); updateButtons(); }
function updateButtons(){
  const loading=$('#playBtn').classList.contains('loading'), p=audio.paused;
  const spin='<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
  $('#playBtn').innerHTML=loading&&!p?spin:(p?PLAY_I:PAUSE_I).replace(/22/g,'40');
  $('#playBtn').setAttribute('aria-label',p?'ניגון':'השהיה');
  $('#miniPP').innerHTML=(p?PLAY_I:PAUSE_I).replace(/22/g,'26'); $('#miniPP').setAttribute('aria-label',p?'ניגון':'השהיה');
  document.body.classList.toggle('paused',p);
  document.querySelectorAll('.row.playing .pb').forEach(b=>b.innerHTML=p?PLAY_I:'<span class="eq"><i></i><i></i><i></i></span>');
}
function updateNowPlaying(){
  if(!current)return;
  $('#pK').textContent=current.folderName; $('#pT').textContent=current.title+(current.yearLabel?' · '+current.yearLabel:'');
  $('#pM').textContent=current.rabbi; $('#miniT').textContent=current.title+(current.yearLabel?' '+current.yearLabel:''); $('#miniM').textContent=current.folderName+' · '+current.rabbi;
  $('#pFav').setAttribute('aria-pressed',favs.has(current.id)); $('#pFav').querySelector('path').setAttribute('fill',favs.has(current.id)?'currentColor':'none');
  $('#dlBtn').href=downloadUrl(current);
  if('mediaSession' in navigator){ navigator.mediaSession.metadata=new MediaMetadata({title:current.title+(current.yearLabel?' '+current.yearLabel:''),artist:current.rabbi,album:'מעיינות · '+current.folderName,artwork:[{src:new URL('rabbi.jpg',location.href).href,sizes:'627x434',type:'image/jpeg'},{src:new URL('icon-512.png',location.href).href,sizes:'512x512',type:'image/png'}]}); }
}
function updateTime(){
  const d=audio.duration,t=audio.currentTime; if(!isFinite(d)||!d)return; const pct=t/d*100, sk=$('#seek');
  if(!sk.dragging){sk.value=Math.round(t/d*1000);sk.style.setProperty('--p',pct+'%');}
  $('#tCur').textContent=fmt(t);$('#tLeft').textContent='-'+fmt(d-t);$('#miniP').style.width=pct+'%';
  if('mediaSession' in navigator&&navigator.mediaSession.setPositionState){try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate,position:Math.min(t,d)});}catch(e){}}
}
audio.addEventListener('loadedmetadata',()=>{ const p=progress[current&&current.id]; if(p&&!p.done&&p.t>10&&p.t<audio.duration-15){audio.currentTime=Math.max(0,p.t-3);toast('ממשיכים מאיפה שעצרת · '+fmt(p.t));} audio.playbackRate=prefs.rate; updateTime(); });
audio.addEventListener('timeupdate',()=>{updateTime();saveProgress(false);});
audio.addEventListener('play',updateButtons);
audio.addEventListener('playing',()=>setLoading(false));
audio.addEventListener('waiting',()=>setLoading(true));
audio.addEventListener('pause',()=>{saveProgress(true);updateButtons();});
audio.addEventListener('ended',()=>{ saveProgress(true); if(current){progress[current.id]=Object.assign(progress[current.id]||{},{done:true});store.set('progress',progress);} if(SLEEP[sleepIdx]===-1){setSleep(0);refresh();return;} const n=queue[queue.indexOf(current.id)+1]; if(prefs.auto&&n)play(n,queue); else refresh(); });
audio.addEventListener('error',()=>{ if(!current)return; setLoading(false); toast(window.PREVIEW?'בתצוגה המקדימה אין ניגון – באתר עצמו השיעורים מתנגנים':'לא ניתן לנגן את השיעור כרגע. בדקו את החיבור ונסו שוב.'); });

const seek=$('#seek');
seek.addEventListener('input',()=>{seek.dragging=true;seek.style.setProperty('--p',seek.value/10+'%');$('#tCur').textContent=fmt(seek.value/1000*(audio.duration||0));});
seek.addEventListener('change',()=>{if(isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration;seek.dragging=false;});
function showRate(){$('#rateV').textContent=(prefs.rate===1?'1':prefs.rate)+'×';}
$('#rateBtn').onclick=()=>{prefs.rate=RATES[(RATES.indexOf(prefs.rate)+1)%RATES.length];audio.playbackRate=prefs.rate;store.set('prefs',prefs);showRate();};
function setSleep(i){ sleepIdx=i;clearInterval(sleepTimer);const v=SLEEP[i];$('#sleepBtn').setAttribute('aria-pressed',v!==0);
  if(v===0){$('#sleepV').textContent='כבוי';return;} if(v===-1){$('#sleepV').textContent='סוף שיעור';return;}
  sleepEnd=Date.now()+v*60000; const tick=()=>{const l=sleepEnd-Date.now(); if(l<=0){audio.pause();setSleep(0);toast('הטיימר הסתיים');return;} $('#sleepV').textContent=Math.ceil(l/60000)+' דק׳';}; tick(); sleepTimer=setInterval(tick,15000); }
$('#sleepBtn').onclick=()=>setSleep((sleepIdx+1)%SLEEP.length);
function showAuto(){$('#autoBtn').setAttribute('aria-pressed',prefs.auto);$('#autoV').textContent=prefs.auto?'פעיל':'כבוי';}
$('#autoBtn').onclick=()=>{prefs.auto=!prefs.auto;store.set('prefs',prefs);showAuto();};
$('#playBtn').onclick=togglePlay; $('#miniPP').onclick=togglePlay;
$('#backBtn').onclick=()=>skip(-SKIP); $('#fwdBtn').onclick=()=>skip(SKIP);
$('#prevBtn').onclick=()=>step(-1); $('#nextBtn').onclick=()=>step(1);
$('#pFav').onclick=()=>{ if(!current)return; const id=current.id; if(favs.has(id)){favs.delete(id);toast('הוסר מהשמורים');}else{favs.add(id);toast('נשמר בשמורים');} store.set('favs',[...favs]); updateNowPlaying(); };
function openPlayer(){const p=$('#player');p.classList.add('open');p.setAttribute('aria-hidden','false');setTimeout(()=>$('#playBtn').focus({preventScroll:true}),300);}
function closePlayer(){const p=$('#player');p.classList.remove('open');p.setAttribute('aria-hidden','true');$('#miniOpen').focus();}
$('#miniOpen').onclick=openPlayer; $('#pClose').onclick=closePlayer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#player').classList.contains('open'))closePlayer(); if(/INPUT|TEXTAREA/.test(e.target.tagName))return; if(e.code==='Space'&&current){e.preventDefault();togglePlay();} });
if('mediaSession' in navigator){ const ms=navigator.mediaSession, set=(a,f)=>{try{ms.setActionHandler(a,f);}catch(e){}};
  set('play',()=>audio.play()); set('pause',()=>audio.pause()); set('seekbackward',d=>skip(-(d&&d.seekOffset||SKIP))); set('seekforward',d=>skip(d&&d.seekOffset||SKIP));
  set('previoustrack',()=>step(-1)); set('nexttrack',()=>step(1)); set('seekto',d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime;}); }

/* clicks */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-play],[data-folder],[data-tab],[data-home],[data-playall],[data-kind],[data-donate],[data-top]'); if(!t)return;
  if('top' in t.dataset){ e.preventDefault(); if(/^#f-/.test(location.hash)){ history.pushState('', '', location.pathname); renderHome(); } window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.play){ e.preventDefault(); play(t.dataset.play); return; }
  if(t.dataset.playall){ const f=FOLDERS.find(x=>x.id===t.dataset.playall); if(f)play(f.shiurim[0].id,f.shiurim.map(s=>s.id)); return; }
  if(t.dataset.folder){ location.hash='f-'+t.dataset.folder; return; }
  if(t.dataset.tab){ tab=t.dataset.tab; store.set('tab',tab); const y=window.scrollY; renderHome(); window.scrollTo(0,y); return; }
  if(t.dataset.kind){ document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b===t)); return; }
  if('donate' in t.dataset){ setTimeout(()=>{const b=document.querySelector('[data-kind="donate"]'); if(b)b.click();},50); return; }
  if('home' in t.dataset){ e.preventDefault(); location.hash='archive'; }
});
window.addEventListener('hashchange',()=>{ if(/^#f-/.test(location.hash)) route(); else { if(!$('#archive')) renderHome(); route(); } });
document.addEventListener('submit',e=>{ if(e.target.id!=='cform')return; e.preventDefault(); const f=e.target;
  if(!f.name.value.trim()||!f.contact.value.trim()){toast('נא למלא שם ופרטי קשר');return;}
  f.innerHTML='<p style="font-weight:700;font-size:1.1rem;color:var(--navy)">תודה! (בגרסת ההדגמה הטופס עדיין לא שולח מייל)</p>'; });

/* misc */
function applyScale(){document.documentElement.dataset.scale=prefs.scale;}
$('#scaleBtn').onclick=()=>{prefs.scale=prefs.scale%3+1;store.set('prefs',prefs);applyScale();toast(['טקסט רגיל','טקסט גדול','טקסט גדול מאוד'][prefs.scale-1]);};
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProgress(true);});
window.addEventListener('pagehide',()=>saveProgress(true));
window.addEventListener('scroll',()=>$('#bar').classList.toggle('scrolled',scrollY>10),{passive:true});
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').hidden=false;});
$('#installBtn').onclick=async()=>{ if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').hidden=true;return;} toast('באייפון: כפתור השיתוף ← "הוספה למסך הבית"'); };
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!(matchMedia('(display-mode: standalone)').matches||navigator.standalone))$('#installBtn').hidden=false;
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.INLINE_CATALOG)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyScale();showRate();showAuto();updateButtons();loadCatalog();
</script>
</body>
</html>
