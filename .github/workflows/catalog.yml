name: Update catalog
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths: ['sources.json', 'scripts/build_catalog.py', '.github/workflows/catalog.yml']
permissions:
  contents: write
concurrency: catalog
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build catalog from Google Drive
        env:
          DRIVE_KEY: AIzaSyBnD0itBvTaxXyC6zS_X3c3ue7wLy86exM
        run: python scripts/build_catalog.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain library.json)" ]; then
            git config user.name "catalog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add library.json
            git commit -m "עדכון אוטומטי של רשימת השיעורים"
            git push
          fi
